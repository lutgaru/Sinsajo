name: Server CI/CD

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  ci:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'server/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  docker:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name || '', 'server/')
    needs: ci
    runs-on: ubuntu-latest
    environment: docker_hub 
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute Docker tag from release
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "value=${RELEASE_TAG##*/}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/sinsajo-server
          tags: |
            type=raw,value=${{ steps.release_tag.outputs.value }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,format=short

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name || '', 'server/')
    needs: ci
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/sinsajo-server
          - os: windows-latest
            binary: target\release\sinsajo-server.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build
        run: cargo build --release

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARY: ${{ matrix.binary }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$BINARY" --clobber

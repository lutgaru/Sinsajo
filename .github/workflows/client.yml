name: Client CI/CD

on:
  push:
    paths:
      - 'sinsajo_client/**'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'sinsajo_client/**'
      - '.github/workflows/client.yml'
  release:
    types: [published]

jobs:
  ci:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'client/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinsajo_client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release-android:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name || '', 'client/')
    needs: ci
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinsajo_client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --clobber

  # Web is now deployed together with docs-site via docs.yml
  # (Flutter web is built and merged into Astro dist/app during Pages deploy)
  # No separate Pages job here to avoid race conditions.

  # Rolling "latest client" release.
  # GitHub only supports ONE /releases/latest redirect per repo, so a server
  # release would hijack it. This job mirrors the APK into a stable
  # `client-latest` tag instead: /releases/tag/client-latest
  update-client-latest:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name || '', 'client/')
    needs: release-android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror APK to client-latest rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/client-latest
          gh release download "$SOURCE_TAG" -p "app-release.apk" -D /tmp/client-latest --clobber
          gh release delete client-latest --cleanup-tag -y || true
          gh release create client-latest \
            --title "Client Latest ($SOURCE_TAG)" \
            --notes "Rolling release tracking the latest client build. Source: $SOURCE_TAG." \
            --latest=false \
            /tmp/client-latest/app-release.apk
